<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hinos · Estudo por Voz</title>

  <meta name="theme-color" content="#C9A86A">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --gold: #C9A86A;
      --dark: #222;
      --border: #d0d0d0;
      --bg: #fafafa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--dark);
    }
    header {
      padding: 14px 10px 6px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      background: rgba(250,250,250,0.96);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      min-width: 70px;
    }
    .tab.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
      font-weight: 600;
    }
    main {
      padding: 8px 8px 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 4px 4px 2px;
      color: #555;
    }
    .info {
      font-size: 10px;
      margin: 0 4px 6px;
      color: #777;
    }
    .table-header, .row {
      display: grid;
      grid-template-columns: 1.4fr 0.7fr repeat(4, 0.6fr);
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .table-header {
      padding: 6px 8px;
      border-radius: 8px;
      background: #f0f0f0;
      font-weight: 600;
      position: sticky;
      top: 70px;
      z-index: 10;
    }
    .rows {
      margin-top: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      background: #fff;
    }
    .row {
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
    }
    .row:last-child { border-bottom: none; }
    .tone { opacity: 0.9; }
    .num { text-align: center; font-variant-numeric: tabular-nums; }
    .voice-label {
      font-size: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .chk-wrap { text-align: center; }
    input[type="checkbox"] {
      width: 16px; height: 16px;
    }
    .hint {
      font-size: 10px;
      color: #777;
      margin: 8px 4px 2px;
      text-align: center;
    }
    footer {
      text-align: center;
      font-size: 9px;
      color: #aaa;
      padding: 4px 0 8px;
    }
  </style>
</head>
<body>
<header>
  <h1>Hinos · Estudo por Voz</h1>
  <div class="tabs">
    <button class="tab active" data-tab="A">Ensaio</button>
    <button class="tab" data-tab="B">Jovens</button>
    <button class="tab" data-tab="C">Culto / Of.</button>
  </div>
</header>

<main>
  <div id="section-title" class="section-title"></div>
  <div id="section-info" class="info"></div>
  <div class="table-header">
    <div>Tom / Hino</div>
    <div class="voice-label">Nº</div>
    <div class="voice-label">S</div>
    <div class="voice-label">C</div>
    <div class="voice-label">T</div>
    <div class="voice-label">B</div>
  </div>
  <div id="rows" class="rows"></div>
  <p class="hint">
    Toque nos quadradinhos para marcar o que já foi estudado em cada voz.
    As marcações ficam salvas apenas neste aparelho (localStorage).
  </p>
</main>

<footer>
  PWA offline · depois de hospedado, adicione à tela inicial do celular.
</footer>
